<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AIM 3: File Manager</title>
</head>
<body>
    <h2>File Upload & Download System</h2>

    <fieldset>
        <legend>Upload File</legend>
        <form action="/upload" method="post" enctype="multipart/form-data">
            <input type="file" name="file" required>
            <input type="submit" value="Upload">
        </form>
    </fieldset>

    <br>

    <fieldset>
        <legend>Available Files</legend>
        <ul>
            {% for file in files %}
                <li>
                    {{ file }} -
                    <a href="{{ url_for('download_file', filename=file) }}">Download</a>
                </li>
            {% else %}
                <li>No files uploaded yet.</li>
            {% endfor %}
        </ul>
    </fieldset>
</body>
</html>
